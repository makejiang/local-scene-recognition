<svg width="224" height="224" viewBox="0 0 224 224" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="112" y1="24" x2="112" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#82B7BD"/>
      <stop offset="1" stop-color="#548C93"/>
    </linearGradient>
    <linearGradient id="card" x1="60" y1="60" x2="140" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F0E4"/>
      <stop offset="1" stop-color="#ECE0CC"/>
    </linearGradient>
    <linearGradient id="lilac" x1="120" y1="60" x2="190" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DED3E2"/>
      <stop offset="1" stop-color="#CABAD3"/>
    </linearGradient>
    <!-- Faint top sheen so the flat 2.5D tile still catches a little light. -->
    <linearGradient id="tileSheen" x1="112" y1="20" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Flat 2.5D background tile: just a soft drop shadow (no puffy lighting). -->
    <filter id="tileFlat" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#274F56" flood-opacity="0.30"/>
    </filter>

    <!-- Clay/soft-3D: blur the silhouette into a height map, then light it
         (matte diffuse for volume + soft specular for the plasticine sheen).
         surfaceScale/blur tuned per element size. -->
    <filter id="clayCard" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#274F56" flood-opacity="0.34" result="ds"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="8" diffuseConstant="1.05" lighting-color="#ffffff" result="d">
        <feDistantLight azimuth="230" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="d" in2="SourceAlpha" operator="in" result="dc"/>
      <feBlend in="SourceGraphic" in2="dc" mode="multiply" result="sh"/>
      <feSpecularLighting in="h" surfaceScale="8" specularConstant="0.3" specularExponent="16" lighting-color="#ffffff" result="s">
        <fePointLight x="55" y="20" z="130"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
      <feComposite in="sh" in2="sc" operator="arithmetic" k1="0" k2="1" k3="0.9" k4="0" result="lit"/>
      <feMerge>
        <feMergeNode in="ds"/>
        <feMergeNode in="lit"/>
      </feMerge>
    </filter>

    <!-- Raised clay glyphs / sparkle: smaller blur so strokes stay crisp. -->
    <filter id="clayRaise" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#3a2b53" flood-opacity="0.30" result="ds"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="5" diffuseConstant="1.1" lighting-color="#ffffff" result="d">
        <feDistantLight azimuth="230" elevation="58"/>
      </feDiffuseLighting>
      <feComposite in="d" in2="SourceAlpha" operator="in" result="dc"/>
      <feBlend in="SourceGraphic" in2="dc" mode="multiply" result="sh"/>
      <feSpecularLighting in="h" surfaceScale="5" specularConstant="0.35" specularExponent="20" lighting-color="#ffffff" result="s">
        <fePointLight x="40" y="10" z="80"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
      <feComposite in="sh" in2="sc" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
      <feMerge>
        <feMergeNode in="ds"/>
        <feMergeNode in="lit"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square tile — flat 2.5D: gradient + soft shadow + top sheen -->
  <rect x="22" y="20" width="180" height="180" rx="50" fill="url(#tile)" filter="url(#tileFlat)"/>
  <rect x="22" y="20" width="180" height="180" rx="50" fill="url(#tileSheen)"/>

  <!-- Back number card -->
  <g transform="rotate(12 158 112)">
    <rect x="120" y="62" width="80" height="100" rx="15" fill="url(#lilac)" filter="url(#clayCard)"/>
    <text x="159" y="120" font-family="'Arial Rounded MT Bold','Segoe UI',Arial,sans-serif" font-weight="800" font-size="30" fill="#7C7091" text-anchor="middle" filter="url(#clayRaise)">123</text>
  </g>

  <!-- Front letter card -->
  <g transform="rotate(-7 86 121)">
    <rect x="42" y="62" width="88" height="114" rx="20" fill="url(#card)" filter="url(#clayCard)"/>
    <text x="86" y="152" font-family="'Arial Rounded MT Bold','Segoe UI',Arial,sans-serif" font-weight="800" font-size="88" fill="#6E88A8" text-anchor="middle" filter="url(#clayRaise)">A</text>
  </g>

</svg>
